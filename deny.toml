# Cargo-deny 0.19. Policy: `Proxiima.Repository.dependencyPolicy`.

[advisories]
unmaintained = "workspace"
yanked = "deny"
# No advisories are ignored. Add an `ignore` entry only with a comment and a tracking issue.
ignore = []

# The allowlist includes each member of a conjunctive SPDX expression.
[licenses]
# The allowlist deliberately excludes LGPL.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
