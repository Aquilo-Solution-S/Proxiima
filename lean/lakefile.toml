name = "proxiima"
defaultTargets = ["Causa", "Proxiima", "ledger"]

[leanOptions]
warningAsError = true

[[require]]
name = "teslavalve"
git = "https://github.com/Aquilo-Solution-S/tesla-valve.git"
rev = "43baa7a75543870c069352b251541e4e37298915"
subDir = "lean"

[[lean_lib]]
name = "Causa"

[[lean_lib]]
name = "Proxiima"
globs = ["Proxiima.+"]

[[lean_exe]]
name = "ledger"
root = "Main"
needs = ["Causa", "Proxiima"]
supportInterpreter = true
