[package]
name = "proxiima-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Test and tutorial fixture spiice for Proxiima; not a product."

[lib]
name = "proxiima_example"

[features]
default = []
# Serve the example as a `proxiima` app (`SpiiceApp`, through
# `proxiima::spiice_app!`): the host tier, for the hosts and tools that boot it.
host = ["dep:proxiima"]
testkit = ["host"]

[dependencies]
proxiima-spiice = { path = "../../crates/proxiima-spiice" }
proxiima = { path = "../../crates/proxiima", optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proxiima = { path = "../../crates/proxiima", features = ["testkit"] }
proxiima-example = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }

[lints]
workspace = true
