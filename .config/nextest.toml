[profile.default]
# Eight processes peak near 60 client backends. Check pg_stat_activity against the server's max_connections before raising test-threads.
test-threads = 8
# No retries: a retry turns a test that failed on a missing resource into a
# pass and hides the failure. A failing test fails the run.
retries = 0
# A hung test is killed and reported by name (TIMEOUT) instead of holding CI
# until the job times out. Flagged SLOW after each 60s period, killed after 5
# (300s). With fsync off on the disposable server (#646), the slowest test
# in a full local run is well under 5s (host_template_pg
# sixteen_concurrent_clones_are_distinct_and_complete was ~1.4s), so 300s
# leaves large headroom for a slower CI runner. A hung test costs at most
# 5 minutes, inside the test job's 45.
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "fail"
