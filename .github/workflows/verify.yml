name: Verify

# `main` takes direct pushes; `verified` names the last commit that passed CI.
# Work starts from `verified`, releases are cut only from it, and this workflow
# is the only writer of it and the rolling `nightly` tag.
#
#   green  CI passes on the newest `main` commit and every commit since
#          `verified` has a review record (scripts/verify-review.py) ->
#          `verified` fast-forwards and `nightly` moves to that same commit
#          atomically. release.yml cuts a numbered tag only if the workspace
#          version was deliberately bumped.
#   no record
#          CI passes but a commit lacks the record: `verified` stays where it
#          is until a later push records the review.
#   red    `verified` stays where it is, and `main` stays red until a commit
#          fixes it.
#
# One run at a time. GitHub keeps one pending run per group and lets a newer
# push replace it, so pushes that land during a run are verified together.

on:
  push:
    branches: [main]
  # A person runs verify again on the newest `main` commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  target:
    name: range
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.range.outputs.base }}
      tip: ${{ steps.range.outputs.tip }}
      pending: ${{ steps.range.outputs.pending }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: range
        run: |
          # Every commit verify checks out or advances `verified` to comes
          # from main's history. That is what makes running it with
          # main's cache scope safe, and a dispatch from any other branch
          # would otherwise verify and release an unmerged commit.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::verify runs on main only, not ${GITHUB_REF}"
            exit 1
          fi
          base="$(git rev-parse origin/verified)"
          tip="${GITHUB_SHA}"
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "tip=${tip}" >> "${GITHUB_OUTPUT}"
          if git merge-base --is-ancestor "${tip}" "${base}"; then
            echo "::notice::${tip} is already verified"
            echo "pending=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git merge-base --is-ancestor "${base}" "${tip}"; then
            echo "::error::verified (${base}) is not an ancestor of ${tip}; main was rewritten"
            exit 1
          fi
          echo "pending=true" >> "${GITHUB_OUTPUT}"

  ci:
    needs: target
    if: ${{ needs.target.outputs.pending == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      base: ${{ needs.target.outputs.base }}

  record:
    name: review record
    needs: target
    if: ${{ needs.target.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ needs.target.outputs.base }}
          TIP: ${{ needs.target.outputs.tip }}
        run: |
          python3 scripts/verify-review.py check --base "${BASE}" --tip "${TIP}"

  advance:
    name: advance verified and nightly
    needs: [target, ci, record]
    if: ${{ needs.ci.result == 'success' && needs.record.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.target.outputs.tip }}
          fetch-depth: 0
      # One transaction keeps both refs on the tested commit. Only the rolling
      # tag is forced; `verified` still requires a fast-forward. No release
      # object is created for nightly, and numbered tags are never moved.
      - name: publish verified and nightly
        run: git push --atomic origin HEAD:refs/heads/verified +HEAD:refs/tags/nightly

  release:
    needs: advance
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
