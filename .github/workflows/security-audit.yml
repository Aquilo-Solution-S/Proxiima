# `Proxiima.Repository.DependencyCheck`. New advisories can arrive between source changes.
name: security-audit

on:
  schedule:
    # 06:17 UTC daily — offset from the top of the hour to avoid the scheduler rush.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # cargo-deny-action v2.0.20 pinned by commit SHA (kept current by Dependabot).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories
