name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  CLA-Assistant:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'))
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: >-
          (github.event_name == 'issue_comment' || !contains(github.event.pull_request.labels.*.name, 'CLA signed') || github.event.action == 'synchronize') &&
          github.actor != 'cla-assistant' &&
          github.actor != 'github-actions[bot]' &&
          github.actor != 'dependabot[bot]'
        # contributor-assistant/github-action@v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/Aquilo-Solution-S/Proxiima/blob/main/.github/cla/CLA.md'
          branch: 'main'
          allowlist: 'HeinrichvH,heinrichvonhelmolt,boreas-aquilo,cla-assistant,dependabot,dependabot[bot]'
