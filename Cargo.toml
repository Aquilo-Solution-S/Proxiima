[workspace]
resolver = "3"
members = ["crates/core", "crates/proxiima-server", "apps/proxiima-mcp", "spiices/example", "crates/llm-openai-compat", "crates/storage-pg", "crates/blob-s3", "crates/proxiima", "crates/proxiima-spiice", "crates/pg-testkit", "tools/dev-migrate", "tools/dev-idp", "crates/auth-oidc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/Aquilo-Solution-S/proxiima"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
# `assert!(x.is_empty())` states the intent; the lint's `assert_eq!(x, [])` needs `[] as [T; 0]` where `T` is not inferred.
assert_is_empty = "allow"

[workspace.dependencies]
fluent-uri = "0.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rust_decimal = { version = "1.36.0", default-features = false, features = ["serde"] }
uuid = { version = "1.12.1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2.0.18"
tokio = { version = "1.40.0", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time", "macros", "migrate", "sqlx-toml"] }
# Binary `vector` / `halfvec` binds (#379): a text bind cast in SQL is not a
# constant under a generic plan, so the server re-parses it per scored row.
pgvector = { version = "0.4.2", default-features = false, features = ["sqlx", "halfvec"] }
url = "2.5.4"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1.89"
bytes = "1.11.1"
blake3 = "1"
time = { version = "0.3.47", default-features = false, features = ["formatting", "parsing", "serde", "serde-human-readable", "serde-well-known", "std", "large-dates"] }
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
# Metric instruments only: a library records through the API and the host installs the meter provider, so no SDK or exporter is a dependency of a library crate.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
# The host that serves exports over OTLP: HTTP/protobuf from the exporter's own
# reader thread, so the blocking client; `reqwest-rustls` is its TLS.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "preserve_order"] }
boon = "0.6"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Enable the AWS-LC backend to avoid a panic at the first RS256 sign.
# TLS and JWT use AWS-LC. S3 requests use regional SigV4.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
aws-lc-rs = "1.15.0"
base64 = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1.5"
httpdate = "1.0.3"
http-body = "1"
http-body-util = "0.1.2"
tokio-util = "0.7.9"
tower = "0.5.2"
hex = "0.4.3"
whatlang = "0.18"
sha2 = "0.11"
subtle = "2.6"
# The default S3 TLS feature would pull a second, legacy Rustls stack.
# Omit `sigv4a`. Multi-Region Access Points are unsupported.
aws-sdk-s3 = { version = "1.79.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 3
